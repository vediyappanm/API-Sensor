image:
  repository: ghcr.io/api-sentinel-team/sensor
  tag: "0.2.0"
  pullPolicy: IfNotPresent

resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

sensor:
  bpfObjectPath: /opt/sensor/http_trace.bpf.o
  ingestUrl: https://api-sentinel-ingest:8443/v1/events
  ingestPort: 8443
  accountId: "1000000"
  batchSize: "200"
  role: server
  maxBufferBytes: "65536"
  maxTotalBufferBytes: "104857600"
  metricsPort: 9090
  sampleDefault: "100"
  sampleHealth: "5"

apiKeySecret:
  name: api-sentinel-sensor
  key: api-key

serviceAccount:
  create: true
  name: api-sentinel-sensor

metricsService:
  enabled: true
  port: 9090

rbac:
  create: true

priorityClassName: system-node-critical

# CRI socket path — change per node if using cri-o, docker, or custom socket locations
# containerd (default): /run/containerd/containerd.sock
# cri-o: /run/crio/crio.sock
# docker: /var/run/docker.sock
criSocketPath: /run/containerd/containerd.sock

nodeSelector: {}
tolerations: []
