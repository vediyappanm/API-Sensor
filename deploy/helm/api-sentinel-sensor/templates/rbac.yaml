{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "api-sentinel-sensor.fullname" . }}
  labels:
    {{- include "api-sentinel-sensor.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "api-sentinel-sensor.fullname" . }}
  labels:
    {{- include "api-sentinel-sensor.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "api-sentinel-sensor.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "api-sentinel-sensor.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
