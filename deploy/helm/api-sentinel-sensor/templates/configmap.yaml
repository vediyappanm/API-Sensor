apiVersion: v1
kind: ConfigMap
metadata:
  name: api-sentinel-sensor
  labels:
    app.kubernetes.io/name: api-sentinel-sensor
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- /*
  Scope is mandatory. With hostPID the sensor can read the decrypted traffic of EVERY process on the
  node, including other tenants' workloads. Either list the namespaces to capture or state, on
  purpose, that this node is dedicated to the monitored workloads.
*/ -}}
{{- if and (empty .Values.sensor.onlyNamespaces) (not .Values.sensor.captureAllWorkloads) }}
{{- fail "Set sensor.onlyNamespaces (the namespaces to capture) or, on a node dedicated to monitored workloads, sensor.captureAllWorkloads=true" }}
{{- end }}
data:
  ONLY_NAMESPACES: {{ join "," .Values.sensor.onlyNamespaces | quote }}
  INGEST_URL: {{ .Values.sensor.ingestUrl | quote }}
  ACCOUNT_ID: {{ .Values.sensor.accountId | quote }}
  TENANT_ID: {{ .Values.sensor.tenantId | quote }}
  POLICY_VERSION: {{ .Values.sensor.policyVersion | quote }}
  CRI_SOCKET: {{ .Values.sensor.criSocket | quote }}
  BATCH_SIZE: {{ .Values.sensor.batchSize | quote }}
  ROLE: {{ .Values.sensor.role | quote }}
  MAX_BUFFER_BYTES: {{ .Values.sensor.maxBufferBytes | quote }}
  MAX_TOTAL_BUFFER_BYTES: {{ .Values.sensor.maxTotalBufferBytes | quote }}
  METRICS_PORT: {{ .Values.sensor.metricsPort | quote }}
  SAMPLE_DEFAULT: {{ .Values.sensor.sampleDefault | quote }}
  SAMPLE_HEALTH: {{ .Values.sensor.sampleHealth | quote }}
