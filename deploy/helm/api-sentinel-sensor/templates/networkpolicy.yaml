apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "api-sentinel-sensor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "api-sentinel-sensor.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "api-sentinel-sensor.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: prometheus
    ports:
    - protocol: TCP
      port: {{ .Values.sensor.metricsPort }}
  egress:
  # Allow egress to ingest endpoint
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: {{ .Values.sensor.ingestPort | default 8443 }}
  # Allow DNS (TCP and UDP)
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow Kubernetes API
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
