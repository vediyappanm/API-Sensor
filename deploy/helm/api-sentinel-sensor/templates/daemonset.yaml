apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: api-sentinel-sensor
  labels:
    app.kubernetes.io/name: api-sentinel-sensor
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: api-sentinel-sensor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-sentinel-sensor
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.sensor.metricsPort | quote }}
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      hostPID: true
      # The sensor never talks to the Kubernetes API (pod metadata comes from the CRI socket), so it
      # gets no service-account token.
      automountServiceAccountToken: false
      containers:
        - name: sensor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --bpf={{ .Values.sensor.bpfObjectPath }}
            - --ingest=$(INGEST_URL)
            - --account-id=$(ACCOUNT_ID)
            - --tenant-id=$(TENANT_ID)
            - --policy-version=$(POLICY_VERSION)
            - --batch-size=$(BATCH_SIZE)
            - --role=$(ROLE)
            - --max-buffer-bytes=$(MAX_BUFFER_BYTES)
            - --max-total-buffer-bytes=$(MAX_TOTAL_BUFFER_BYTES)
            - --metrics-port=$(METRICS_PORT)
            - --sample-default=$(SAMPLE_DEFAULT)
            - --sample-health=$(SAMPLE_HEALTH)
            - --discover-libs
          envFrom:
            - configMapRef:
                name: api-sentinel-sensor
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiKeySecret.name }}
                  key: {{ .Values.apiKeySecret.key }}
            - name: PII_HASH_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.piiHashKeySecret.name }}
                  key: {{ .Values.piiHashKeySecret.key }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: RUST_LOG
              value: "info"
          # The API key reaches the sensor through the API_KEY env var only (clap reads it). It must not
          # be an argument: arguments are visible to every process on the node through /proc.
          # Least privilege, verified by running this exact spec on a real node:
          #   BPF, PERFMON, SYS_RESOURCE  load and attach the probes
          #   SYS_PTRACE                  read other processes' /proc maps to find their TLS libraries
          #   SYS_ADMIN                   Ubuntu/Debian kernels (kernel.perf_event_paranoid > 2) require it for
          #                               perf_event_open, which uprobes use; without it every attach is -EACCES
          # Not needed, so not granted: privileged, NET_ADMIN, hostNetwork, hostIPC, the host root mount.
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
              add:
                - BPF
                - PERFMON
                - SYS_RESOURCE
                - SYS_PTRACE
                - SYS_ADMIN
          ports:
            - name: metrics
              containerPort: {{ .Values.sensor.metricsPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: cri-sock
              mountPath: {{ .Values.sensor.criSocket }}
      volumes:
        - name: btf
          hostPath:
            path: /sys/kernel/btf
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: cri-sock
          hostPath:
            path: {{ .Values.sensor.criSocket }}
            type: Socket
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
