{{- if .Values.metricsService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: api-sentinel-sensor-metrics
  labels:
    app.kubernetes.io/name: api-sentinel-sensor
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.metricsService.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: api-sentinel-sensor
{{- end }}
