[package]
name = "api-sec-sensor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "api-sec-sensor"
path = "src/main.rs"

[lib]
name = "api_sec_sensor"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
bytes = "1"
capstone = "0.11"
clap = { version = "4", features = ["derive", "env"] }
elf = "0.7"
flate2 = "1.0"
http = "1"
hpack = { package = "hpack-patched", version = "0.3" }
indexmap = { version = "2", features = ["std"] }
libbpf-rs = "0.23"
prost = "0.13"
regex = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
libc = "0.2"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "signal"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tonic = { version = "0.12", features = ["transport"] }
tower = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[build-dependencies]
tonic-build = "0.12"
