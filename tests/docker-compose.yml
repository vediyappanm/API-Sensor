services:

  # HTTP/1.1 + HTTP/2 target
  httpbin:
    image: kennethreitz/httpbin
    ports: ["18080:80"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/get"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Go HTTPS service — tests Go crypto/tls + HTTP/2 (Go serves h2 by default over TLS)
  go-api:
    build: ./test-servers/go
    ports: ["18443:8443"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "https://localhost:8443/health", "--no-check-certificate"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Node.js HTTPS — static OpenSSL
  node-api:
    build: ./test-servers/node
    ports: ["18444:8444"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "https://localhost:8444/health", "--no-check-certificate"]
      interval: 5s
      timeout: 3s
      retries: 10

  # WebSocket server (wss://)
  ws-server:
    build: ./test-servers/websocket
    ports: ["18445:8445"]

  # MCP/SSE server — JSON-RPC 2.0 (HTTP on 7777, HTTPS on 7778)
  mcp-server:
    build: ./test-servers/mcp
    ports:
      - "17777:7777"
      - "17778:7778"

  # gRPC test server — TLS on 50051
  grpc-server:
    build: ./test-servers/grpc
    ports: ["19000:50051"]

  # GnuTLS TLS server — tests gnutls_record_send/recv uprobes
  gnutls-server:
    build: ./test-servers/gnutls
    ports: ["18446:8446"]

  # GnuTLS client — pre-built image with gnutls-cli (avoids apt-get on every run)
  gnutls-client:
    build: ./test-servers/gnutls-client
    profiles: ["tools"]
    depends_on: ["gnutls-server"]

  # QUIC/HTTP3 server — tests quiche quic_conn_stream_recv/send uprobes
  quic-server:
    build: ./test-servers/quic
    ports: ["18447:8447/udp"]

  # QUIC client — reuses the same image (has http3-client binary + libquiche.so)
  quic-client:
    build: ./test-servers/quic
    profiles: ["tools"]
    depends_on: ["quic-server"]

  # Ingest validator — collects and validates captured events
  ingest-validator:
    build: ./test-servers/validator
    ports: ["${VALIDATOR_PORT_MAP:-29999:9999}"]
    environment:
      - VALIDATOR_PORT=9999
