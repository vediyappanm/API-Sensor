name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            userspace/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('userspace/Cargo.lock') }}

      - name: Run unit tests
        working-directory: userspace
        run: cargo test --release

      - name: Run adversarial tests
        working-directory: userspace
        run: cargo test --release --test adversarial

      - name: Check formatting
        working-directory: userspace
        run: cargo fmt --check || true

      - name: Clippy lints
        working-directory: userspace
        run: cargo clippy --release -- -D warnings || true

  build-docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t api-sensor:test -f Dockerfile .
