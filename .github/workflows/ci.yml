name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            userspace/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('userspace/Cargo.lock') }}

      - name: Check formatting
        working-directory: userspace
        run: cargo fmt --check

      - name: Clippy lints
        working-directory: userspace
        run: cargo clippy --release -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            userspace/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('userspace/Cargo.lock') }}

      - name: Run unit tests
        working-directory: userspace
        run: cargo test --release

      - name: Run adversarial tests
        working-directory: userspace
        run: cargo test --release --test adversarial

  build-bpf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install BPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev linux-tools-common \
            build-essential pkg-config libelf-dev zlib1g-dev

      - name: Compile BPF program
        run: |
          clang -O2 -g -Wall -target bpf \
            -D__TARGET_ARCH_x86 \
            -I/usr/include/x86_64-linux-gnu \
            -c bpf/http_trace.bpf.c \
            -o bpf/http_trace.bpf.o

  build-docker:
    runs-on: ubuntu-latest
    needs: [lint, test, build-bpf]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t api-sensor:test -f Dockerfile .
