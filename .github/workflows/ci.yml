name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    name: Rust check + clippy + test + audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm libbpf-dev linux-tools-common \
            build-essential pkg-config libelf-dev zlib1g-dev \
            libssl-dev libzstd-dev protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            userspace/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('userspace/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Compile BPF object
        run: |
          clang -O2 -g -target bpf \
            -D__TARGET_ARCH_x86 \
            -I/usr/include/x86_64-linux-gnu \
            -c bpf/http_trace.bpf.c \
            -o bpf/http_trace.bpf.o

      - name: cargo fmt --check
        working-directory: userspace
        run: cargo fmt -- --check

      - name: cargo clippy
        working-directory: userspace
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: userspace
        run: cargo test --lib --verbose

      - name: cargo audit
        working-directory: userspace
        run: cargo audit

      - name: cargo build --release
        working-directory: userspace
        run: cargo build --release

      - name: cargo build --release --features otel
        working-directory: userspace
        run: cargo build --release --features otel

  docker:
    name: Docker build + publish
    runs-on: ubuntu-24.04
    needs: check
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify image health endpoint
        run: |
          docker build -t api-sentinel-sensor:ci .
          docker run --rm --entrypoint /bin/bash api-sentinel-sensor:ci \
            -c "test -x /opt/sensor/api-sec-sensor && echo 'Binary exists'"

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint deploy/helm/api-sentinel-sensor/

  # E2E tests require privileged access to load BPF programs.
  # Runs on self-hosted runners with kernel 5.8+ and BPF support,
  # or can be triggered manually for pre-release validation.
  e2e:
    name: E2E test (privileged)
    runs-on: ubuntu-24.04
    needs: docker
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Build verification image
        run: docker build -f Dockerfile.verify -t api-sentinel-verify .

      - name: Run E2E test suite
        run: |
          docker run --rm --privileged --network=host --pid=host \
            -v "$(pwd)":/sensor/ebpf \
            -v /sys/fs/bpf:/sys/fs/bpf \
            -v /sys/kernel/btf:/sys/kernel/btf:ro \
            api-sentinel-verify \
            bash /sensor/ebpf/scripts/e2e-test.sh
