name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libelf-dev zlib1g-dev clang llvm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            userspace/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('userspace/Cargo.lock') }}

      - name: Check formatting
        working-directory: userspace
        run: cargo fmt --check

      - name: Clippy lints
        working-directory: userspace
        run: cargo clippy --release -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libelf-dev zlib1g-dev clang llvm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            userspace/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('userspace/Cargo.lock') }}

      - name: Run unit tests
        working-directory: userspace
        run: cargo test --release

      - name: Run adversarial tests
        working-directory: userspace
        run: cargo test --release --test adversarial

  build-bpf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install BPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev \
            build-essential pkg-config libelf-dev zlib1g-dev \
            linux-tools-common linux-tools-$(uname -r) || true

      - name: Generate vmlinux.h
        run: |
          if [ -f /sys/kernel/btf/vmlinux ]; then
            bpftool btf dump file /sys/kernel/btf/vmlinux format c > bpf/vmlinux.h
          else
            echo "BTF not available, using fallback vmlinux.h generation"
            # Use kernel headers as fallback — extract minimal BTF types
            # The Dockerfile build always generates its own vmlinux.h, so this
            # CI step only needs to validate that the BPF C code compiles.
            sudo apt-get install -y linux-headers-$(uname -r) || true
            if command -v bpftool &>/dev/null && [ -f /sys/kernel/btf/vmlinux ]; then
              bpftool btf dump file /sys/kernel/btf/vmlinux format c > bpf/vmlinux.h
            else
              echo "WARNING: Cannot generate vmlinux.h — skipping BPF compilation check"
              echo "Docker build will still generate vmlinux.h correctly"
              exit 0
            fi
          fi

      - name: Compile BPF program
        run: |
          if [ ! -f bpf/vmlinux.h ]; then
            echo "vmlinux.h not available, skipping BPF compilation (Docker build validates this)"
            exit 0
          fi
          clang -O2 -g -Wall -target bpf \
            -D__TARGET_ARCH_x86 \
            -I/usr/include/x86_64-linux-gnu \
            -c bpf/http_trace.bpf.c \
            -o bpf/http_trace.bpf.o

  build-docker:
    runs-on: ubuntu-latest
    needs: [lint, test, build-bpf]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t api-sensor:test -f Dockerfile .
