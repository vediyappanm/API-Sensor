name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libelf-dev zlib1g-dev clang llvm protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            userspace/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('userspace/Cargo.lock') }}

      - name: Check formatting
        working-directory: userspace
        run: cargo fmt --check

      - name: Clippy lints
        working-directory: userspace
        run: cargo clippy --release -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libelf-dev zlib1g-dev clang llvm protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            userspace/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('userspace/Cargo.lock') }}

      - name: Run unit tests
        working-directory: userspace
        run: cargo test --release

      - name: Run adversarial tests
        working-directory: userspace
        run: cargo test --release --test adversarial

  build-bpf:
    runs-on: ubuntu-latest
    # BPF compilation is best-effort in CI — Docker build is the authoritative check
    # Azure runners may lack bpftool or kernel BTF depending on the kernel version
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install BPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev \
            build-essential pkg-config libelf-dev zlib1g-dev

      - name: Install bpftool
        run: |
          KERNEL_VER=$(uname -r)
          sudo apt-get install -y "linux-tools-${KERNEL_VER}" 2>/dev/null \
            || sudo apt-get install -y linux-tools-generic 2>/dev/null \
            || true

          # On Azure runners, bpftool is installed but not in PATH.
          # The binary lives at /usr/lib/linux-tools/<version>/bpftool
          if ! command -v bpftool &>/dev/null; then
            BPFTOOL_BIN=$(find /usr/lib/linux-tools -name bpftool -type f 2>/dev/null | head -1)
            if [ -n "$BPFTOOL_BIN" ]; then
              sudo ln -sf "$BPFTOOL_BIN" /usr/local/bin/bpftool
              echo "Linked bpftool from $BPFTOOL_BIN"
            fi
          fi

          # Verify
          if command -v bpftool &>/dev/null; then
            echo "bpftool version: $(bpftool version 2>&1 | head -1)"
          else
            echo "::warning::bpftool not available on this runner"
          fi

      - name: Generate vmlinux.h from kernel BTF
        run: |
          if command -v bpftool &>/dev/null && [ -f /sys/kernel/btf/vmlinux ]; then
            bpftool btf dump file /sys/kernel/btf/vmlinux format c > bpf/vmlinux.h
            echo "Generated vmlinux.h ($(wc -l < bpf/vmlinux.h) lines)"
          else
            echo "::warning::Cannot generate vmlinux.h — skipping BPF compile"
            echo "SKIP_BPF=true" >> "$GITHUB_ENV"
          fi

      - name: Compile BPF program
        if: env.SKIP_BPF != 'true'
        run: |
          clang -O2 -g -Wall -target bpf \
            -D__TARGET_ARCH_x86 \
            -I/usr/include/x86_64-linux-gnu \
            -c bpf/http_trace.bpf.c \
            -o bpf/http_trace.bpf.o

  build-docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t api-sensor:test -f Dockerfile .

  # Real, multi-protocol end-to-end capture test. Builds the BPF object + sensor,
  # loads them on the runner's live kernel (ubuntu-latest has a 6.x kernel + BTF +
  # sudo), and drives REAL local traffic across every major capture surface —
  # OpenSSL (HTTP/1.1 + HTTP/2 via nginx), plaintext HTTP, GnuTLS, and Go
  # crypto/tls — asserting the full path for each: BPF load -> uprobe/tracepoint
  # capture -> parse/protocol detect -> PII redaction -> ingest delivery.
  # Hermetic (no external network). This is the gate that exercises the actual
  # capture path — unlike the unit/adversarial tests which run parsers in isolation.
  e2e-capture:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm libbpf-dev \
            pkg-config libssl-dev libelf-dev zlib1g-dev protobuf-compiler \
            curl openssl python3 \
            nginx-light gnutls-bin golang-go   # protocol drivers: HTTP/2, GnuTLS, Go crypto/tls

      - name: Require kernel BTF (CO-RE capture needs it)
        run: |
          if [ ! -f /sys/kernel/btf/vmlinux ]; then
            echo "::error::runner kernel $(uname -r) lacks BTF — cannot run the CO-RE capture test"
            exit 1
          fi
          echo "kernel $(uname -r) has BTF"

      - name: Build BPF object
        run: |
          # Compile from the committed, arch-specific vmlinux.h — same as the
          # Dockerfile (no bpftool needed). CO-RE relocates field offsets against
          # the runner's live kernel BTF at load time (verified in the step above).
          cp bpf/vmlinux.x86_64.h bpf/vmlinux.h
          clang -O2 -g -Wall -target bpf -D__TARGET_ARCH_x86 \
            -I/usr/include/x86_64-linux-gnu \
            -c bpf/http_trace.bpf.c -o bpf/http_trace.bpf.o
          test -f bpf/http_trace.bpf.o

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            userspace/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('userspace/Cargo.lock') }}

      - name: Build release sensor
        working-directory: userspace
        run: cargo build --release

      - name: Run hermetic e2e capture test
        run: sudo -E ./scripts/e2e-ci.sh
        env:
          SENSOR_BIN: ${{ github.workspace }}/userspace/target/release/api-sec-sensor
          BPF_OBJ: ${{ github.workspace }}/bpf/http_trace.bpf.o
